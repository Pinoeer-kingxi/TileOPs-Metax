# 鈹€鈹€ MoeReduceFused 鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€鈹€
# Shared fields for all MoeReduceFused variants.
MoeReduceFusedFwdOp: &reduce_fused_base
  ref_api: "none"
  family: moe
  status: spec-only
  source:
    kernel: tileops/kernels/moe/reduce_fused.py
    op: tileops/ops/moe/reduce_fused.py
    test: tests/ops/test_moe_reduce_fused.py
    bench: benchmarks/ops/bench_moe_reduce_fused.py
    bench_manifest_driven: true
    kernel_map:
      reduce_fused_kernel: MoeReduceFusedKernel

  signature:
    inputs:
      x: {dtype: "float16 | bfloat16 | float32", shape: "[E, H]"}
      token_topk_to_pos: {dtype: "int32", shape: "[T, K]", note: "-1 indicates a padding slot, skipped during reduction"}
      topk_weights: {dtype: "float32", shape: "[T, K]"}
    outputs:
      out: {dtype: "same_as(x)", shape: "[T, H]"}
    params:
      num_tokens: {type: int}
      num_topk: {type: int}
      hidden: {type: int}
      out: {type: tensor, default: null, note: "optional pre-allocated output, created automatically when omitted"}
    shape_rules:
    - "E == T * K"
    - "T == num_tokens"
    - "K == num_topk"
    - "H == hidden"
    - "hidden % 256 == 0"

  workloads:
    # DeepSeek-V3: H=7168, K=8
  - {num_tokens: 512, num_topk: 8, hidden: 7168, dtypes: [bfloat16], label: "deepseek-v3-decode"}
  - {num_tokens: 4096, num_topk: 8, hidden: 7168, dtypes: [bfloat16], label: "deepseek-v3-prefill"}
    # Qwen3-235B-A22B: H=7168, K=8
  - {num_tokens: 512, num_topk: 8, hidden: 7168, dtypes: [bfloat16], label: "qwen3-235b-decode"}
    # Qwen3-30B-A3B: H=3072, K=8
  - {num_tokens: 512, num_topk: 8, hidden: 3072, dtypes: [bfloat16], label: "qwen3-30b-decode"}
    # Kimi K2: H=7168, K=8
  - {num_tokens: 512, num_topk: 8, hidden: 7168, dtypes: [bfloat16], label: "kimi-k2-decode"}
    # fp16 smoke
  - {num_tokens: 32, num_topk: 2, hidden: 256, dtypes: [float16], label: "tiny-fp16-smoke"}

  roofline:
    vars:
      T: num_tokens
      K: num_topk
      H: hidden
    # One multiply-add per (token, topk slot, hidden element).
    flops: "2 * T * K * H"
    # x read [T*K, H] + topk_weights read [T, K] float32 +
    # token_topk_to_pos read [T, K] int32 + out write [T, H].
    bytes: "(T * K * H + T * H) * elem_bytes + T * K * 4 + T * K * 4"

MoeReduceFusedWithXsfFwdOp:
  <<: *reduce_fused_base
  variant_of: MoeReduceFusedFwdOp
  signature:
    inputs:
      x: {dtype: "float16 | bfloat16 | float32", shape: "[E, H]"}
      token_topk_to_pos: {dtype: "int32", shape: "[T, K]", note: "-1 indicates a padding slot, skipped during reduction"}
      topk_weights: {dtype: "float32", shape: "[T, K]"}
      x_sf: {dtype: "float32", shape: "[E]", note: "per-token scaling factor (x_sf extracted from QuantTensor)"}
    outputs:
      out: {dtype: "same_as(x)", shape: "[T, H]"}
    params:
      num_tokens: {type: int}
      num_topk: {type: int}
      hidden: {type: int}
      out: {type: tensor, default: null, note: "optional pre-allocated output, created automatically when omitted"}
    shape_rules:
    - "E == T * K"
    - "T == num_tokens"
    - "K == num_topk"
    - "H == hidden"
    - "hidden % 256 == 0"

  workloads:
  - {num_tokens: 512, num_topk: 8, hidden: 7168, dtypes: [bfloat16], label: "deepseek-v3-decode-xsf"}
  - {num_tokens: 32, num_topk: 2, hidden: 256, dtypes: [float16], label: "tiny-fp16-xsf-smoke"}

  roofline:
    vars:
      T: num_tokens
      K: num_topk
      H: hidden
    flops: "2 * T * K * H"
    # Additional x_sf read [T*K] float32 vs base.
    bytes: "(T * K * H + T * H) * elem_bytes + T * K * 4 + T * K * 4 + T * K * 4"

MoeReduceFusedFp8FwdOp:
  <<: *reduce_fused_base
  variant_of: MoeReduceFusedFwdOp
  signature:
    inputs:
      x: {dtype: "float16 | bfloat16 | float32", shape: "[E, H]"}
      token_topk_to_pos: {dtype: "int32", shape: "[T, K]", note: "-1 indicates a padding slot, skipped during reduction"}
      topk_weights: {dtype: "float32", shape: "[T, K]"}
      sf: {dtype: "float32", shape: "[1]", note: "required global scaling factor for FP8 output"}
    outputs:
      out: {dtype: "float8_e4m3fn", shape: "[T, H]"}
    params:
      num_tokens: {type: int}
      num_topk: {type: int}
      hidden: {type: int}
      out: {type: tensor, default: null, note: "optional pre-allocated output, created automatically when omitted"}
    shape_rules:
    - "E == T * K"
    - "T == num_tokens"
    - "K == num_topk"
    - "H == hidden"
    - "hidden % 256 == 0"

  workloads:
  - {num_tokens: 512, num_topk: 8, hidden: 7168, dtypes: [bfloat16], label: "deepseek-v3-decode-fp8out"}
  - {num_tokens: 32, num_topk: 2, hidden: 256, dtypes: [float16], label: "tiny-fp16-fp8out-smoke"}

  roofline:
    vars:
      T: num_tokens
      K: num_topk
      H: hidden
    flops: "2 * T * K * H"
    # out dtype is float8 (1 byte/elem); additional sf read [1] float32.
    bytes: "(T * K * H) * elem_bytes + (T * H) * 1 + T * K * 4 + T * K * 4 + 4"

MoeReduceFusedQuantizedFwdOp:
  <<: *reduce_fused_base
  variant_of: MoeReduceFusedFwdOp
  signature:
    inputs:
      x: {dtype: "float16 | bfloat16 | float32", shape: "[E, H]"}
      token_topk_to_pos: {dtype: "int32", shape: "[T, K]", note: "-1 indicates a padding slot, skipped during reduction"}
      topk_weights: {dtype: "float32", shape: "[T, K]"}
      x_sf: {dtype: "float32", shape: "[E]", note: "per-token scaling factor (x_sf extracted from QuantTensor)"}
      sf: {dtype: "float32", shape: "[1]", note: "required global scaling factor for FP8 output"}
    outputs:
      out: {dtype: "float8_e4m3fn", shape: "[T, H]"}
    params:
      num_tokens: {type: int}
      num_topk: {type: int}
      hidden: {type: int}
      out: {type: tensor, default: null, note: "optional pre-allocated output, created automatically when omitted"}
    shape_rules:
    - "E == T * K"
    - "T == num_tokens"
    - "K == num_topk"
    - "H == hidden"
    - "hidden % 256 == 0"

  workloads:
  - {num_tokens: 512, num_topk: 8, hidden: 7168, dtypes: [bfloat16], label: "deepseek-v3-decode-fullquant"}
  - {num_tokens: 32, num_topk: 2, hidden: 256, dtypes: [float16], label: "tiny-fp16-fullquant-smoke"}

  roofline:
    vars:
      T: num_tokens
      K: num_topk
      H: hidden
    flops: "2 * T * K * H"
    # FP8 output (1 byte/elem) + both x_sf [T*K] float32 and sf [1] float32.
    bytes: "(T * K * H) * elem_bytes + (T * H) * 1 + T * K * 4 + T * K * 4 + T * K * 4 + 4"

MoeTop2SumGateFwdOp:
  ref_api: "none"
  family: moe
  status: spec-only

  signature:
    inputs:
      logits:
        dtype: float32
        note: router scores, shape [num_tokens, num_routed_experts]
      bias:
        dtype: float32
        note: per-routed-expert bias, shape [num_routed_experts]
    outputs:
      topk_idx:
        dtype: int64
        note: selected expert indices after optional physical mapping and EP/TP mask
      topk_weights:
        dtype: float32
        note: normalized routing weights
    params:
      num_topk: {type: int}
      num_topk_groups: {type: int}
      num_groups: {type: int}
      use_shared_as_routed: {type: bool, default: false}
      num_shared_experts: {type: int, default: 0}
      routed_scaling_factor: {type: float, default: 1.0}
      ep_rank: {type: int, default: 0}
      num_ep_ranks: {type: int, default: 1}
      tp_rank: {type: int, default: 0}
      num_tp_ranks: {type: int, default: 1}
      scoring_func: {type: str, default: sigmoid}
      mask:
        type: "torch.Tensor | None"
        default: null
        note: optional bool tensor [num_tokens]; False tokens write -1 / 0 outputs
      fix_routing_mask:
        type: "torch.Tensor | None"
        default: null
        note: optional bool tensor [num_tokens]; True tokens reuse unmapped_topk_idx
      to_physical_map:
        type: "torch.Tensor | None"
        default: null
        note: optional int32 tensor [num_logical_experts, num_duplicate_experts]
      logical_count:
        type: "torch.Tensor | None"
        default: null
        note: optional int32 tensor [num_logical_experts]
      unmapped_topk_idx:
        type: "torch.Tensor | None"
        default: null
        note: optional int64 tensor [num_tokens, num_topk], updated in-place
    shape_rules:
    - "logits.ndim == 2"
    - "bias.shape == (logits.shape[1],)"
    - "num_topk > 0"
    - "num_topk <= logits.shape[1]"
    - "(num_groups == 0) == (num_topk_groups == 0)"
    - "num_topk_groups <= num_groups"
    - "num_ep_ranks > 0"
    - "num_tp_ranks > 0"
    - "0 <= ep_rank < num_ep_ranks"
    - "0 <= tp_rank < num_tp_ranks"
    - "topk_idx.shape == (logits.shape[0], num_topk + (num_shared_experts if use_shared_as_routed else 0))"
    - "topk_weights.shape == topk_idx.shape"

  workloads:
    # Source coverage includes no-group, grouped, shared-expert, mask,
    # fixed-routing, physical-map, and EP/TP-mask paths. These workloads
    # pin representative C500 validation points for the Manifest contract;
    # PR B will expand correctness and benchmark matrices.
  - {logits_shape: [4001, 128], num_topk: 6, num_topk_groups: 0, num_groups: 0, scoring_func: sigmoid, dtypes: [float32], label: "no-group-sigmoid"}
  - {logits_shape: [4001, 128], num_topk: 6, num_topk_groups: 0, num_groups: 0, scoring_func: softmax, dtypes: [float32], label: "no-group-softmax"}
  - {logits_shape: [4001, 128], num_topk: 6, num_topk_groups: 0, num_groups: 0, scoring_func: sqrtsoftplus, dtypes: [float32], label: "no-group-sqrtsoftplus"}
  - {logits_shape: [4001, 256], num_topk: 8, num_topk_groups: 4, num_groups: 8, scoring_func: sigmoid, dtypes: [float32], label: "grouped-top2-sum"}
  - {logits_shape: [8001, 256], num_topk: 8, num_topk_groups: 8, num_groups: 8, use_shared_as_routed: true, num_shared_experts: 2, scoring_func: sigmoid, dtypes: [float32], label: "shared-experts"}

  roofline:
    vars:
      T: "logits_shape[0]"
      E: "logits_shape[1]"
      K: "num_topk"
      S: "num_shared_experts if use_shared_as_routed else 0"
    # Routing is dominated by scoring, compare/shuffle reductions, and
    # metadata writes rather than GEMM FLOPs. This first-order estimate is
    # refined with C500 benchmark and mcProfiler evidence in PR B.
    flops: "T * E * 8 + T * K * 4"
    bytes: "T * E * 4 + E * 4 + T * (K + S) * 8 + T * (K + S) * 4"

  source:
    # Planned PR B locations; path existence is deferred while this entry is spec-only.
    kernel: tileops/kernels/moe/top2_sum_gate.py
    op: tileops/ops/moe/top2_sum_gate.py
    test: tests/ops/test_moe_top2_sum_gate.py
    bench: benchmarks/ops/bench_moe_top2_sum_gate.py

MoeGetFusedMappingOp:
  ref_api: "none"
  family: moe
  status: spec-only

  signature:
    inputs:
      topk_idx: {dtype: "int64"}
    outputs:
      pos_to_expert: {dtype: "int32"}
      pos_to_token: {dtype: "int32"}
      pos_to_token_topk: {dtype: "int32"}
      token_topk_to_pos: {dtype: "int32"}
      expert_start: {dtype: "int32"}
      expert_end: {dtype: "int32"}
      num_tokens_per_expert: {dtype: "int32"}
    params:
      num_experts: {type: int, dtype: "int32"}
      num_expanded_tokens: {type: int, dtype: "int32"}
      alignment: {type: int, dtype: "int32"}
    shape_rules:
    - "num_experts > 0"
    - "num_expanded_tokens >= 0"
    - "alignment > 0"
    - "topk_idx.ndim == 2"
    - "topk_idx.shape[1] > 0"
    - "0 < num_experts <= 1024"
    - "alignment > 0"
    - "num_expanded_tokens >= 0"
    - "topk_idx.shape[0] == 0 or num_expanded_tokens >= ((topk_idx.shape[0] * topk_idx.shape[1] + (alignment - 1) * num_experts) // alignment) * alignment"
    - "pos_to_expert.shape == (num_expanded_tokens,)"
    - "pos_to_token.shape == (num_expanded_tokens,)"
    - "pos_to_token_topk.shape == (num_expanded_tokens,)"
    - "token_topk_to_pos.shape == topk_idx.shape"
    - "expert_start.shape == (num_experts,)"
    - "expert_end.shape == (num_experts,)"
    - "num_tokens_per_expert.shape == (num_experts,)"

  workloads:
  - {
      topk_idx: [512, 8],
      num_experts: 256,
      num_expanded_tokens: 20224,
      alignment: 64,
      dtypes: [int64],
      label: "routing-medium-e256-a64"
    }
  - {
      topk_idx: [4096, 8],
      num_experts: 256,
      num_expanded_tokens: 65280,
      alignment: 128,
      dtypes: [int64],
      label: "routing-prefill-e256-a128"
    }

  roofline:
    vars:
      N: "product(topk_idx.shape)"
    flops: "0"
    bytes: "N * 8 + (3 * num_expanded_tokens + N + 3 * num_experts) * 4"

  source:
    # Planned PR B locations; path existence is deferred while this entry is spec-only.
    kernel: tileops/kernels/moe/get_fused_mapping.py
    op: tileops/ops/moe/get_fused_mapping.py
    test: tests/ops/test_get_fused_mapping.py
    bench: benchmarks/ops/bench_get_fused_mapping.py

TopKGateFwdOp:
  # Stable MoE expert selection. For equal scores, the lower expert index wins.
  ref_api: "none"
  family: moe
  status: spec-only

  signature:
    inputs:
      scores: {dtype: "float32", shape: "[num_tokens, num_experts]"}
    outputs:
      topk_idx: {dtype: "int64", shape: "[num_tokens, num_topk]"}
    params:
      num_topk: {type: int, kw_only: true}
    shape_rules:
    - "scores.ndim == 2"
    - "scores.shape[1] > 0"
    - "0 < num_topk <= scores.shape[1]"
    - "topk_idx.shape == (scores.shape[0], num_topk)"

  workloads:
    # DeepSeek-V3: E=256, K=8
  - {num_tokens: 512, num_experts: 256, num_topk: 8, dtypes: [float32], label: "deepseek-v3-decode-routing"}
  - {num_tokens: 4096, num_experts: 256, num_topk: 8, dtypes: [float32], label: "deepseek-v3-prefill-routing"}
    # Qwen3-235B-A22B: E=128, K=8
  - {num_tokens: 512, num_experts: 128, num_topk: 8, dtypes: [float32], label: "qwen3-235b-decode-routing"}
  - {num_tokens: 4096, num_experts: 128, num_topk: 8, dtypes: [float32], label: "qwen3-235b-prefill-routing"}

  roofline:
    # Repeated stable argmax selection: one comparison pass per selected expert.
    flops: "num_tokens * num_topk * num_experts"
    # Read FP32 scores once and write INT64 expert indices.
    bytes: "num_tokens * num_experts * elem_bytes + num_tokens * num_topk * 8"

  source:
    # Planned PR B locations; path existence is deferred while this entry is spec-only.
    kernel: tileops/kernels/moe/topk_gate.py
    op: tileops/ops/moe/topk_gate.py
    test: tests/ops/test_moe_topk_gate.py
    bench: benchmarks/ops/bench_moe_topk_gate.py

MoeTopKSumGroupIdxFwdOp:
  ref_api: "none"
  family: moe
  status: spec-only

  signature:
    inputs:
      scores: {dtype: "float32", shape: "[num_tokens, num_groups, num_experts_per_group]"}
    outputs:
      # Group ranking is stable: equal group scores prefer the smaller group index.
      group_topk_idx: {dtype: "int64", shape: "[num_tokens, num_topk_groups]"}
    params:
      num_topk_sum: {type: int}
      num_topk_groups: {type: int}
    shape_rules:
    - "num_tokens >= 0"
    - "1 <= num_groups <= 32"
    - "num_experts_per_group > 0"
    - "num_topk_sum in (1, 2)"
    - "num_topk_sum <= num_experts_per_group"
    - "0 < num_topk_groups <= num_groups"

  workloads:
  - {num_tokens: 1, num_groups: 8, num_experts_per_group: 32, num_topk_sum: 2, num_topk_groups: 4, dtypes: [float32], label: "deepseek-v3-single-token-routing"}
  - {num_tokens: 512, num_groups: 8, num_experts_per_group: 32, num_topk_sum: 2, num_topk_groups: 4, dtypes: [float32], label: "deepseek-v3-decode-routing"}
  - {num_tokens: 4096, num_groups: 8, num_experts_per_group: 32, num_topk_sum: 2, num_topk_groups: 4, dtypes: [float32], label: "deepseek-v3-prefill-routing"}
  - {num_tokens: 32, num_groups: 12, num_experts_per_group: 6, num_topk_sum: 1, num_topk_groups: 2, dtypes: [float32], label: "non-power-of-two-group-width"}

  roofline:
    # Per token: expert-score comparisons, stable inter-group ranking, and optional top-2 sums.
    flops: "num_tokens * (num_groups * num_experts_per_group + num_groups * num_groups + (num_topk_sum - 1) * num_groups)"
    # Read float32 scores once and write int64 selected group indices.
    bytes: "num_tokens * num_groups * num_experts_per_group * elem_bytes + num_tokens * num_topk_groups * 8"

  source:
    # Source paths become required when this entry transitions to implemented.
    kernel: tileops/kernels/moe/topk_sum_group_idx.py
    op: tileops/ops/moe/topk_sum_group_idx.py
    test: tests/ops/test_moe_topk_sum_group_idx.py
    bench: benchmarks/ops/bench_moe_topk_sum_group_idx.py
