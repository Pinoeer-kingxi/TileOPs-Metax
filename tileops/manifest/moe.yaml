      num_tokens: {type: int}
      num_experts: {type: int}
      top_k: {type: int}
      hidden_size: {type: int}
      ffn_size: {type: int}
      scoring_func: {type: str, default: softmax}
      renormalize: {type: bool, default: false}
      routed_scaling_factor: {type: float, default: 1.0}
      activation: {type: str, default: silu_and_mul, kw_only: true}
    shape_rules:
    - "hidden_states.shape == (num_tokens, hidden_size)"
    - "gating_output.shape == (num_tokens, num_experts)"
    - "output.shape        == (num_tokens, hidden_size)"

  workloads:
    # Qwen3-235B-A22B: scoring_func=softmax
  - {num_tokens: 512, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-decode"}
  - {num_tokens: 4096, num_experts: 128, top_k: 8, hidden_size: 7168, ffn_size: 2048, scoring_func: softmax, renormalize: false, dtypes: [bfloat16], label: "qwen3-235b-prefill"}
