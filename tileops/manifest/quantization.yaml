# Narrow quantization helper operators.
#
# These entries describe existing helper surfaces only. They do not claim the
# full INT8/INT4/NF4/FP8 quantization family from the older release plan.

FP8QuantOp:
  ref_api: "none"
  family: quantization
  status: implemented

  signature:
    inputs:
      input_tensor: {dtype: "float16 | bfloat16 | float32", shape: "[batch, seq_len_kv, kv_group, index_dim]"}
    outputs:
      scale_tensor: {dtype: "float32", shape: "[batch, seq_len_kv, kv_group]"}
      output_tensor: {dtype: "float8_e4m3fn", shape: "[batch, seq_len_kv, kv_group, index_dim]"}
    shape_rules:
    - "input_tensor.ndim == 4"
    - "input_tensor.shape[3] > 0"

  workloads:
  - {batch: 1, seq_len_kv: 8192, kv_group: 1, index_dim: 64, in_dtype: float16, dtypes: [float16], label: "kv-index-8k-d64-fp16"}
  - {batch: 1, seq_len_kv: 8192, kv_group: 1, index_dim: 64, in_dtype: bfloat16, dtypes: [bfloat16], label: "kv-index-8k-d64-bf16"}
  - {batch: 1, seq_len_kv: 4096, kv_group: 1, index_dim: 128, in_dtype: float32, dtypes: [float32], label: "kv-index-4k-d128-fp32"}

  roofline:
    func: "tileops.perf.formulas.fp8_quant_roofline"

  source:
    kernel: tileops/kernels/fp8_quant.py
    kernel_map:
      fp8_quant_kernel: FP8QuantKernel
    op: tileops/ops/fp8_quant.py
    test: tests/ops/test_fp8_quant.py
    bench: benchmarks/ops/bench_fp8_quant.py
    bench_manifest_driven: false

# Fused SwiGLU forward + per-channel FP8 cast + optional transpose.
# Reference: swiglu_forward_and_per_channel_cast_and_transpose in
# MetaX-MACA/TileKernels-Metax (tile_kernels/quant/). No torch.* symbol, so
# ref_api is "none"; output is fp8_e4m3fn with a per-block fp32 scale.
QuantSwiGLUFwdChannelCastTransposeOp:
  ref_api: "none"
  family: quantization
  status: spec-only

  signature:
    inputs:
      x: {dtype: "bfloat16", shape: "[num_tokens, two_hidden]"}
    outputs:
      out: {dtype: "float8_e4m3fn"}
      out_sf: {dtype: "float32"}
    params:
      fmt: {type: str}
      num_per_tokens: {type: int}
      round_sf: {type: bool, default: false}
      without_transpose: {type: bool, default: false}
      swiglu_clamp_value: {type: "float | None", default: null}
    shape_rules:
    - "x.ndim == 2"
    - "x.shape[0] % 128 == 0"
    - "x.shape[1] % 128 == 0"
    - "num_per_tokens in (32, 128)"
    - "fmt == 'e4m3'"
    - "out.shape == (x.shape[0], x.shape[1] // 2) if without_transpose else out.shape == (x.shape[1] // 2, x.shape[0])"
    - "out_sf.shape == (x.shape[0] // num_per_tokens, x.shape[1] // 2)"

  workloads:
  - {x_shape: [4096, 4096], fmt: e4m3, num_per_tokens: 128, dtypes: [bfloat16], label: "t4096-h2048-nt128"}
  - {x_shape: [4096, 1152], fmt: e4m3, num_per_tokens: 128, dtypes: [bfloat16], label: "t4096-h576-nt128"}
  - {x_shape: [8064, 8192], fmt: e4m3, num_per_tokens: 128, without_transpose: true, dtypes: [bfloat16], label: "t8064-h4096-nt128-transpose"}
  - {x_shape: [4096, 14336], fmt: e4m3, num_per_tokens: 32, swiglu_clamp_value: 0.5, dtypes: [bfloat16], label: "t4096-h7168-nt32-clamp"}
  - {x_shape: [8064, 12288], fmt: e4m3, num_per_tokens: 32, without_transpose: true, round_sf: true, swiglu_clamp_value: 0.5, dtypes: [bfloat16], label: "t8064-h6144-nt32-transpose-round-clamp"}
  - {x_shape: [4096, 6144], fmt: e4m3, num_per_tokens: 128, round_sf: true, dtypes: [bfloat16], label: "t4096-h3072-nt128-round"}
  - {x_shape: [8064, 5120], fmt: e4m3, num_per_tokens: 128, without_transpose: true, round_sf: true, dtypes: [bfloat16], label: "t8064-h2560-nt128-transpose-round"}
  - {x_shape: [4096, 5120], fmt: e4m3, num_per_tokens: 32, swiglu_clamp_value: 10.0, dtypes: [bfloat16], label: "t4096-h2560-nt32-clamp10"}
  - {x_shape: [8064, 6144], fmt: e4m3, num_per_tokens: 32, without_transpose: true, swiglu_clamp_value: 10.0, dtypes: [bfloat16], label: "t8064-h3072-nt32-transpose-clamp10"}
  - {x_shape: [4096, 8192], fmt: e4m3, num_per_tokens: 32, round_sf: true, swiglu_clamp_value: 10.0, dtypes: [bfloat16], label: "t4096-h4096-nt32-round-clamp10"}

  roofline:
    vars:
      num_tokens: "x.shape[0]"
      two_hidden: "x.shape[1]"
    # Per output element: SwiGLU silu(gate)*value = 6 (see SiluAndMulFwdOp), plus
    # per-channel absmax (abs+max = 2) and scale-mul (1) = 9. Per scale block,
    # get_sf_and_inv = clamp-max + sf div + sf_inv div = 3 (round_sf=True adds
    # exponent bit-manipulation); blocks = num_tokens/num_per_tokens * hidden.
    flops: "9 * num_tokens * (two_hidden // 2) + 3 * (num_tokens // num_per_tokens) * (two_hidden // 2)"
    # Read x (2*hidden elem/row), write FP8 out (1 B/elem) + fp32 per-block sf.
    bytes: "num_tokens * two_hidden * elem_bytes + num_tokens * (two_hidden // 2) + (num_tokens // num_per_tokens) * (two_hidden // 2) * 4"

  source:
    kernel: tileops/kernels/quant_swiglu_channel_cast_transpose.py
    op: tileops/ops/quant_swiglu_channel_cast_transpose.py
    test: tests/ops/test_quant_swiglu_channel_cast_transpose.py
    bench: benchmarks/ops/bench_quant_swiglu_channel_cast_transpose.py
    bench_manifest_driven: false



QuantPerChannelCastFusedOp:
  ref_api: "none"
  family: quantization
  status: spec-only

  signature:
    inputs:
      x: {dtype: "bfloat16 | float32", shape: "[num_tokens, hidden]"}
    outputs:
      out: {dtype: "float8_e4m3fn", shape: "[num_tokens, hidden]"}
      out_sf: {dtype: "float32", shape: "[sf_rows, hidden]"}
    params:
      fmt: {type: str, default: "e4m3"}
      num_per_tokens: {type: int, default: 128}
      round_sf: {type: bool, default: false}
    shape_rules:
    - "fmt == 'e4m3'"
    - "num_per_tokens == 128"
    - "num_tokens % num_per_tokens == 0"
    - "hidden > 0 and hidden % 128 == 0"
    - "sf_rows == (num_tokens + num_per_tokens - 1) // num_per_tokens"
    # For output block b and channel h, out_sf[b, h] is derived from
    # max(abs(x[t, h])) over t in that 128-token block, clamped to at least
    # 1e-4 and divided by the e4m3 maximum 448. With round_sf=true it is
    # rounded up to the nearest power of two. out stores x / out_sf in e4m3.

  workloads:
  - {x_shape: [128, 1024], fmt: e4m3, num_per_tokens: 128, round_sf: false, dtypes: [bfloat16], label: "small-bf16"}
  - {x_shape: [1024, 4096], fmt: e4m3, num_per_tokens: 128, round_sf: true, dtypes: [bfloat16], label: "medium-rounded-bf16"}
  - {x_shape: [4096, 8192], fmt: e4m3, num_per_tokens: 128, round_sf: false, dtypes: [float32], label: "large-fp32"}

  roofline:
    vars:
      num_tokens: "x.shape[0]"
      hidden: "x.shape[1]"
      sf_rows: "(num_tokens + num_per_tokens - 1) // num_per_tokens"
    flops: "3 * num_tokens * hidden + 2 * sf_rows * hidden"
    bytes: "num_tokens * hidden * elem_bytes + num_tokens * hidden + sf_rows * hidden * 4"

  source:
    kernel: tileops/kernels/quant/per_channel_cast_fused.py
    kernel_map:
      per_channel_cast_fused_kernel: PerChannelCastFusedKernel
    op: tileops/ops/quant/per_channel_cast_fused.py
    test: tests/ops/test_per_channel_cast_fused.py
    bench: benchmarks/ops/bench_per_channel_cast_fused.py
    bench_manifest_driven: true

QuantPerChannelCastFusedExpandOp:
  ref_api: "none"
  family: quantization
  status: spec-only
  variant_of: QuantPerChannelCastFusedOp

  signature:
    inputs:
      x: {dtype: "bfloat16 | float32", shape: "[num_tokens, hidden]"}
      pos_to_token: {dtype: "int32", shape: "[num_tokens_out]"}
    outputs:
      out: {dtype: "float8_e4m3fn", shape: "[num_tokens_out, hidden]"}
      out_sf: {dtype: "float32", shape: "[sf_rows, hidden]"}
    params:
      fmt: {type: str, default: "e4m3"}
      num_per_tokens: {type: int, default: 128}
      round_sf: {type: bool, default: false}
    shape_rules:
    - "fmt == 'e4m3'"
    - "num_per_tokens == 128"
    - "num_tokens_out % 16 == 0"
    - "hidden > 0 and hidden % 128 == 0"
    - "sf_rows == (num_tokens_out + num_per_tokens - 1) // num_per_tokens"
    # Each non-negative pos_to_token entry indexes a row of x and must be less
    # than num_tokens. A negative entry is a padding sentinel and produces a
    # zero row before per-channel scaling.

  workloads:
  - {x_shape: [512, 4096], pos_to_token_shape: [1024], fmt: e4m3, num_per_tokens: 128, round_sf: false, dtypes: [bfloat16], label: "gather-bf16"}
  - {x_shape: [1024, 4096], pos_to_token_shape: [2048], fmt: e4m3, num_per_tokens: 128, round_sf: true, dtypes: [float32], label: "gather-rounded-fp32"}

  roofline:
    vars:
      num_tokens_out: "pos_to_token.shape[0]"
      hidden: "x.shape[1]"
      sf_rows: "(num_tokens_out + num_per_tokens - 1) // num_per_tokens"
    flops: "3 * num_tokens_out * hidden + 2 * sf_rows * hidden"
    bytes: "num_tokens_out * hidden * elem_bytes + num_tokens_out * 4 + num_tokens_out * hidden + sf_rows * hidden * 4"

  source:
    kernel: tileops/kernels/quant/per_channel_cast_fused.py
    kernel_map:
      per_channel_cast_fused_kernel: PerChannelCastFusedKernel
    op: tileops/ops/quant/per_channel_cast_fused.py
    test: tests/ops/test_per_channel_cast_fused.py
    bench: benchmarks/ops/bench_per_channel_cast_fused.py
    bench_manifest_driven: true

QuantPerChannelCastFusedRescaleOp:
  ref_api: "none"
  family: quantization
  status: spec-only
  variant_of: QuantPerChannelCastFusedOp

  signature:
    inputs:
      x: {dtype: "float8_e4m3fn", shape: "[num_tokens, hidden]"}
      x_sf_invs: {dtype: "float32", shape: "[num_tokens, sf_cols]"}
    outputs:
      out: {dtype: "float8_e4m3fn", shape: "[num_tokens, hidden]"}
      out_sf: {dtype: "float32", shape: "[sf_rows, hidden]"}
    params:
      fmt: {type: str, default: "e4m3"}
      num_per_tokens: {type: int, default: 128}
      num_per_channels: {type: int, default: 128}
      round_sf: {type: bool, default: false}
    shape_rules:
    - "fmt == 'e4m3'"
    - "num_per_tokens == 128"
    - "num_per_channels == 128"
    - "num_tokens % num_per_tokens == 0"
    - "hidden > 0 and hidden % 256 == 0"
    - "sf_cols * num_per_channels == hidden"
    - "sf_rows == (num_tokens + num_per_tokens - 1) // num_per_tokens"
    # x_sf_invs is the per-token, per-128-channel dequantization scale. The
    # logical input used for amax and requantization is
    # x[t, h] * x_sf_invs[t, h // num_per_channels].

  workloads:
  - {x_shape: [128, 1024], x_sf_invs_shape: [128, 8], fmt: e4m3, num_per_tokens: 128, num_per_channels: 128, round_sf: false, dtypes: [float8_e4m3fn], label: "small-fp8-rescale"}
  - {x_shape: [1024, 4096], x_sf_invs_shape: [1024, 32], fmt: e4m3, num_per_tokens: 128, num_per_channels: 128, round_sf: true, dtypes: [float8_e4m3fn], label: "medium-fp8-rescale-rounded"}

  roofline:
    vars:
      num_tokens: "x.shape[0]"
      hidden: "x.shape[1]"
      sf_cols: "x_sf_invs.shape[1]"
      sf_rows: "(num_tokens + num_per_tokens - 1) // num_per_tokens"
    flops: "5 * num_tokens * hidden + 2 * sf_rows * hidden"
    bytes: "2 * num_tokens * hidden + num_tokens * sf_cols * 4 + sf_rows * hidden * 4"

  source:
    kernel: tileops/kernels/quant/per_channel_cast_fused.py
    kernel_map:
      per_channel_cast_fused_kernel: PerChannelCastFusedKernel
    op: tileops/ops/quant/per_channel_cast_fused.py
    test: tests/ops/test_per_channel_cast_fused.py
    bench: benchmarks/ops/bench_per_channel_cast_fused.py
    bench_manifest_driven: true

QuantPerChannelCastFusedRescaleExpandOp:
  ref_api: "none"
  family: quantization
  status: spec-only
  variant_of: QuantPerChannelCastFusedOp

  signature:
    inputs:
      x: {dtype: "float8_e4m3fn", shape: "[num_tokens, hidden]"}
      x_sf_invs: {dtype: "float32", shape: "[num_tokens, sf_cols]"}
      pos_to_token: {dtype: "int32", shape: "[num_tokens_out]"}
    outputs:
      out: {dtype: "float8_e4m3fn", shape: "[num_tokens_out, hidden]"}
      out_sf: {dtype: "float32", shape: "[sf_rows, hidden]"}
    params:
      fmt: {type: str, default: "e4m3"}
      num_per_tokens: {type: int, default: 128}
      num_per_channels: {type: int, default: 128}
      round_sf: {type: bool, default: false}
    shape_rules:
    - "fmt == 'e4m3'"
    - "num_per_tokens == 128"
    - "num_per_channels == 128"
    - "num_tokens_out % 16 == 0"
    - "hidden > 0 and hidden % 256 == 0"
    - "sf_cols * num_per_channels == hidden"
    - "sf_rows == (num_tokens_out + num_per_tokens - 1) // num_per_tokens"
    # For each valid output token t_out, source token t is
    # pos_to_token[t_out]. The logical input is
    # x[t, h] * x_sf_invs[t, h // num_per_channels]. Negative positions are
    # padding sentinels and contribute zeros.

  workloads:
  - {x_shape: [512, 4096], x_sf_invs_shape: [512, 32], pos_to_token_shape: [1024], fmt: e4m3, num_per_tokens: 128, num_per_channels: 128, round_sf: false, dtypes: [float8_e4m3fn], label: "gather-rescale-fp8"}
  - {x_shape: [1024, 4096], x_sf_invs_shape: [1024, 32], pos_to_token_shape: [2048], fmt: e4m3, num_per_tokens: 128, num_per_channels: 128, round_sf: true, dtypes: [float8_e4m3fn], label: "gather-rescale-fp8-rounded"}

  roofline:
    vars:
      num_tokens_out: "pos_to_token.shape[0]"
      hidden: "x.shape[1]"
      sf_cols: "x_sf_invs.shape[1]"
      sf_rows: "(num_tokens_out + num_per_tokens - 1) // num_per_tokens"
    flops: "5 * num_tokens_out * hidden + 2 * sf_rows * hidden"
    bytes: "2 * num_tokens_out * hidden + num_tokens_out * sf_cols * 4 + num_tokens_out * 4 + sf_rows * hidden * 4"

  source:
    kernel: tileops/kernels/quant/per_channel_cast_fused.py
    kernel_map:
      per_channel_cast_fused_kernel: PerChannelCastFusedKernel
    op: tileops/ops/quant/per_channel_cast_fused.py
    test: tests/ops/test_per_channel_cast_fused.py
    bench: benchmarks/ops/bench_per_channel_cast_fused.py
    bench_manifest_driven: true
